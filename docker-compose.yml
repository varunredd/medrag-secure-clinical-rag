name: medrag

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD}
      POSTGRES_DB: postgres
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init/00-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/medrag_keycloak
      KC_DB_USERNAME: medrag_keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./infra/keycloak/realm-medrag.json:/opt/keycloak/data/import/realm-medrag.json:ro
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [public, private]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private, public]

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/medrag-documents;
      mc mb --ignore-existing local/medrag-indexes;
      mc anonymous set none local/medrag-documents;
      mc anonymous set none local/medrag-indexes;
      exit 0;"
    networks: [private]

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  clamav:
    image: clamav/clamav:1.4
    # Official image is amd64-only; emulate on Apple Silicon so local bring-up works.
    platform: linux/amd64
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc 127.0.0.1 3310 | grep -q PONG"]
      interval: 15s
      timeout: 10s
      retries: 30
    networks: [private]

  api:
    profiles: ["prod-like"]
    build: ./apps/api
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/medrag_core
      DB_USERNAME: medrag_core
      DB_PASSWORD: ${CORE_DB_PASSWORD}
      REDIS_URL: redis://redis:6379/2
      OIDC_ISSUER_URI: http://localhost:8081/realms/medrag
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/medrag/protocol/openid-connect/certs
      OIDC_AUDIENCE: medrag-api
      AI_BASE_URL: http://ai:8000
      INTERNAL_JWT_PRIVATE_KEY_PATH: /run/secrets/internal-private.pem
      INTERNAL_JWT_PUBLIC_KEY_PATH: /run/secrets/internal-public.pem
      INTERNAL_JWT_KEY_ID: ${INTERNAL_JWT_KEY_ID}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: us-east-1
      S3_USE_DEFAULT_CREDENTIALS: "false"
      S3_PATH_STYLE_ACCESS_ENABLED: "true"
      S3_DOCUMENT_BUCKET: medrag-documents
      S3_SSE_ALGORITHM: ""
      S3_KMS_KEY_ID: ""
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      APP_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - ./secrets/internal-private.pem:/run/secrets/internal-private.pem:ro
      - ./secrets/internal-public.pem:/run/secrets/internal-public.pem:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9091:9091"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9091/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [public, private]

  ai:
    profiles: ["prod-like"]
    build: ./services/ai
    environment:
      ENVIRONMENT: docker
      DATABASE_URL: postgresql+asyncpg://medrag_ai:${AI_DB_PASSWORD}@postgres:5432/medrag_ai
      REDIS_URL: redis://redis:6379/0
      JWKS_URL: http://api:8080/.well-known/internal-jwks.json
      JWT_ISSUER: medrag-api
      JWT_AUDIENCE: medrag-ai
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: us-east-1
      S3_USE_DEFAULT_CREDENTIALS: "false"
      DOCUMENT_BUCKET: medrag-documents
      INDEX_BUCKET: medrag-indexes
      S3_SSE_ALGORITHM: ""
      S3_KMS_KEY_ID: ""
      ENCRYPTION_KEY_BASE64: ${AI_ENCRYPTION_KEY_BASE64}
      EMBEDDING_MODEL: NeuML/pubmedbert-base-embeddings
      EMBEDDING_DEVICE: cpu
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-local-only}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_ALLOWED_HOSTS: ${LLM_ALLOWED_HOSTS:-localhost,127.0.0.1,::1,vllm,tgi,llm}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN_FILE: ${VAULT_TOKEN_FILE:-/vault/secrets/token}
      VAULT_NAMESPACE: ${VAULT_NAMESPACE:-}
      SPRING_CALLBACK_BASE_URL: http://api:8080
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [private, public]

  web:
    profiles: ["prod-like"]
    build: ./apps/web
    environment:
      NODE_ENV: production
      APP_BASE_URL: http://localhost:3000
      KEYCLOAK_ISSUER: http://localhost:8081/realms/medrag
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/medrag
      KEYCLOAK_CLIENT_ID: medrag-web
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_WEB_CLIENT_SECRET}
      KEYCLOAK_API_AUDIENCE: medrag-api
      NEXT_SESSION_KEY_BASE64: ${NEXT_SESSION_KEY_BASE64}
      API_INTERNAL_BASE_URL: http://api:8080
      API_HEALTH_URL: http://api:9091/actuator/health/readiness
      AI_INTERNAL_BASE_URL: http://ai:8000
      KEYCLOAK_HEALTH_URL: http://keycloak:9000/health/ready
      STORAGE_HEALTH_URL: http://minio:9000/minio/health/ready
      REDIS_URL: redis://redis:6379/1
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [public, private]

  prometheus:
    profiles: ["prod-like"]
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [api, ai]
    networks: [private, public]

networks:
  public: {}
  private:
    internal: true

volumes:
  postgres-data: {}
  minio-data: {}
  redis-data: {}
  clamav-data: {}

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "medrag-ai"
version = "0.1.0"
description = "Private clinical retrieval and grounded summarization service"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116.0,<1.0",
  "uvicorn[standard]>=0.35.0,<1.0",
  "pydantic-settings>=2.10.0,<3.0",
  "PyJWT[crypto]>=2.10.1,<3.0",
  "sqlalchemy[asyncio]>=2.0.41,<3.0",
  "asyncpg>=0.30.0,<1.0",
  "alembic>=1.16.0,<2.0",
  "boto3>=1.39.0,<2.0",
  "redis>=6.2.0,<7.0",
  "cryptography>=45.0.0,<47.0",
  "sentence-transformers>=5.0.0,<6.0",
  "faiss-cpu>=1.11.0,<2.0",
  "numpy>=2.2.0,<3.0",
  "pypdf>=5.7.0,<6.0",
  "python-docx>=1.2.0,<2.0",
  "httpx>=0.28.1,<1.0",
  "orjson>=3.10.18,<4.0",
  "prometheus-fastapi-instrumentator>=7.1.0,<8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0,<9.0",
  "pytest-asyncio>=1.0.0,<2.0",
  "pytest-cov>=6.2.0,<7.0",
  "ruff>=0.12.0,<1.0",
  "mypy>=1.16.0,<2.0",
  "types-redis>=4.6.0.20241004",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F"]
ignore = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = false
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
